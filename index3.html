
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J-Mart Online Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>J-Mart<span>.</span></h1>
    <input id="search" placeholder="Search products..." type="search">
    <button id="cartButton">🛒 Cart (<span id="cartCount">0</span>)</button>
  </header>

  <section class="hero">
    <h2>Welcome to J-Mart</h2>
    <p>Your everyday shopping store</p>
  </section>

  <main>
    <div class="heading">
      <h2>All Products</h2>
      <select id="sort">
        <option value="default">Default</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
        <option value="name">Name: A to Z</option>
      </select>
    </div>

    <div id="categories" class="categories"></div>
    <p id="count"></p>
    <div id="products" class="products"></div>

    <section id="cartSection">
      <h2>Shopping Cart</h2>
      <div id="cartItems">Your cart is empty.</div>
      <h3>Total: <span id="total">₹0</span></h3>
      <button id="clearCart">Clear Cart</button>
    </section>
  </main>

  <footer>© 2026 J-Mart | Online Shopping</footer>
  <script src="script.js"></script>
</body>
</html>
